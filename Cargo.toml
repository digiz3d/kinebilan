[package]
name = "kinebilan"
version = "0.8.2"
edition = "2024"
default-run = "kinebilan"

[[bin]]
name = "gpui_kit_preview"
path = "src/bin/gpui_kit_preview.rs"
required-features = ["gpui-kit"]

[features]
gpui-kit-tests = ["gpui-kit", "gpui-kit/test-support"]

[build-dependencies]
winresource = "0.1"

[dependencies]
gpui-kit = { version = "0.9", optional = true }
gpui = { package = "gpui-ce", version = "0.2" }
gpui_platform = { package = "gpui_ce_platform", version = "0.1", features = ["font-kit"] }
sdl3 = { version = "0.20", features = ["build-from-source-static", "ttf"] }
sdl3-sys = { version = "0.7", features = ["no-sdl-audio", "no-sdl-joystick", "no-sdl-haptic", "no-sdl-hidapi", "no-sdl-camera", "no-sdl-gpu", "no-sdl-sensor", "no-sdl-power", "no-sdl-dialog", "no-sdl-tray"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
unicode-segmentation = "1"
argon2 = "0.6"
chacha20poly1305 = { version = "0.11", features = ["rand_core"] }
base64 = "0.23"

# The bundled SDL3 / SDL_ttf C/C++ must not use the MSVC debug CRT in dev builds, or linking fails on Windows.
[profile.dev.package.sdl3-sys]
opt-level = 2

[profile.dev.package.sdl3-ttf-sys]
opt-level = 2

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"
